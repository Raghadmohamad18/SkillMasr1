<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>تسجيل المدرب</title>
      <style>
         body{
         background:#F5F5F5;
         }
         .form-box{
         background:white;
         width:90%;
         max-width:600px;
         padding:25px;
         border-radius:15px;
         box-shadow:0 0 10px rgba(0,0,0,0.2);
         }
         h2{
         text-align:center;
         color:#333;
         }
         input, select, textarea{
         width:90%;
         padding:12px;
         margin:10px 0;
         border-radius:8px;
         border:1px solid #ccc;
         }
         button{
         width:90%;
         padding:12px;
         background:#C62828;
         color:white;
         border:none;
         border-radius:8px;
         font-size:16px;
         cursor:pointer;
         }
         button:hover{
         background:#388E3C;
         }
         label{
         font-weight:bold;
         }
         .contact-section {
         background: #000000;
         color: white;
         padding: 30px;
         border-radius: 15px;
         margin: 30px 0;
         text-align: center;
         }
         .contact-section h2 {
         color: #FFFFFF;
         border-bottom: 3px solid #C62828;
         display: inline-block;
         padding-bottom: 10px;
         }
         .contact-section a {
         color: #D4AF37;
         text-decoration: none;
         }
         footer {
         margin-top: 40px;
         text-align: center;
         background:#000000;
         color:white;
         padding: 20px;
         border-top: 3px solid #C62828;
         }
      </style>
   </head>
   <body>
      <center>
         <div class="form-box">
            <h2>بيانات عن المدرب</h2>
            <form id="coachForm">
               <input type="text" id="fullName" placeholder="ادخله هنا" required>
               <label>الاسم كامل</label>
               <label>البريد الالكتروني</label>
               <input type="email" id="email" placeholder="ادخله هنا" required>
               <label>المجال</label>
               <select id="category" required>
                  <option value="">اختار مجالك</option>
                  <option value="Sports">رياضة</option>
                  <option value="Handmade">حرف يدوية</option>
                  <option value="Music">موسيقى و غناء</option>
                  <option value="Programming">برمجة</option>
                  <option value="Other">غيره</option>
               </select>
               <label>اكتب الرياضة او المهارة</label>
               <input type="text"
                  id="specialization"
                  placeholder="مثال:كرة القدم,رسم,العزف">
               <label>محافظة</label>
               <select id="governorate" required>
                  <option value="">اختر المحافظة</option>
                  <option>الإسكندرية</option>
                  <option>أسوان</option>
                  <option>أسيوط</option>
                  <option>البحيرة</option>
                  <option>بني سويف</option>
                  <option>القاهرة</option>
                  <option>الدقهلية</option>
                  <option>دمياط</option>
                  <option>الفيوم</option>
                  <option>الغربية</option>
                  <option>الجيزة</option>
                  <option>الإسماعيلية</option>
                  <option>كفر الشيخ</option>
                  <option>الأقصر</option>
                  <option>مطروح</option>
                  <option>المنيا</option>
                  <option>المنوفية</option>
                  <option>الوادي الجديد</option>
                  <option>شمال سيناء</option>
                  <option>بورسعيد</option>
                  <option>القليوبية</option>
                  <option>قنا</option>
                  <option>البحر الأحمر</option>
                  <option>الشرقية</option>
                  <option>سوهاج</option>
                  <option>جنوب سيناء</option>
                  <option>السويس</option>
               </select>
               <input type="text" id="area" placeholder="مثال: سموحة,اكتوبر">
               <label>المنطقة</label>
               <input type="tel" id="phone" placeholder="01XXXXXXXXX">
               <label>رقم الهاتف</label>
               <input type="number" id="price" placeholder="السعر بالجنيه المصري">
               <label>سعر التدريب</label>
               <textarea id="about" placeholder="اخبرنا اكثر عن خبرتك و مجالك"></textarea>
               <label>تفاصيل عنك</label>
               <input type="file" id="photo" accept="image/*">
               <label>صورة للمدرب</label>
               <input id="certificates" type="file" multiple accept="image/*">
               <label>صور لشهادات المدرب</label>
               <input id="trainingPlaces" type="file" multiple accept="image/*">
               <label>صور لمكان التدريب</label>
               <button type="submit">
               سجل
               </button>
            </form>
         </div>
         <section id="contact" class="contact-section">
           <h2> :تواصل معنا</h2>
           <p>📱عبر الهاتف: +201100351797</p>
           <p> :💬عن طريق واتس آب<ahref="https://wa.me/201100351797">اضغط هنا</a></p>
           <p>skillmasr@gmail.com :عن طريق الايميل</p>
         </section>
      </center>
      <footer>
         <p id="footer-text">© 2026 SkillMasr - جميع الحقوق محفوظة</p>
      </footer>
      <script type="module" src="firebase.js"></script>
      <script type="module">
         import { db } from "./firebase.js";
         import {
           collection,
           addDoc
         } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
         
         const form = document.getElementById("coachForm");
         
         form.addEventListener("submit", async function (e) {
         
             e.preventDefault();
         
             const fullName = document.getElementById("fullName").value;
             const email = document.getElementById("email").value;
             let category = document.getElementById("category").value;
             let specialization = document.getElementById("specialization").value;
             const governorate = document.getElementById("governorate").value;
             const area = document.getElementById("area").value;
             const phone = document.getElementById("phone").value;
             const price = document.getElementById("price").value;
             const about = document.getElementById("about").value;
             const photo = document.getElementById("photo").files[0];
             const certFiles = document.getElementById("certificates").files;
             const placeFiles = document.getElementById("trainingPlaces").files;
             try {
         
                 if (fullName == "") {
                     alert("Enter name");
                     return;
                 }
                 if (phone.length != 11) {
                     alert("Phone must be 11 digits");
                     return;
                 }
         
                 if (price <= 0) {
                     alert("Invalid price");
                     return;
                 }
         
                 let imageUrl = "";
         
         if (photo) {
             const formData = new FormData();
             formData.append("file", photo);
             formData.append("upload_preset", "rbqrpayg");
             const response = await fetch(
                 "https://api.cloudinary.com/v1_1/i1ia28nc/image/upload",
                 {
                     method: "POST",
                     body: formData
                 }
             );
             const data = await response.json();
             console.log(data);
             imageUrl = data.secure_url;
         }    
                 const certs = [];
         const trainingPlaces = [];
         
         for (const file of certFiles) {
             const formData = new FormData();
             formData.append("file", file);
             formData.append("upload_preset", "rbqrpayg");
         
             const res = await fetch(
                 "https://api.cloudinary.com/v1_1/i1ia28nc/image/upload",
                 {
                     method: "POST",
                     body: formData
                 }
             );
         
             const data = await res.json();
             certs.push(data.secure_url);
         }
         
         for (const file of placeFiles) {
             const formData = new FormData();
             formData.append("file", file);
             formData.append("upload_preset", "rbqrpayg");
         
             const res = await fetch(
                 "https://api.cloudinary.com/v1_1/i1ia28nc/image/upload",
                 {
                     method: "POST",
                     body: formData
                 }
             );
         
             const data = await res.json();
             trainingPlaces.push(data.secure_url);
         }
                 await addDoc(collection(db, "coaches"), {
                     fullName,
                     email,
                     category,
                     specialization,
                     governorate,
                     area,
                     phone,
                     price,
                     about,
                     imageUrl,
                     certs,
                     trainingPlaces
                 });
                 localStorage.setItem("loggedIn", "true");
                 alert("تم حفظ البيانات بنجاح");
                 window.location.href = "index.html";
             } catch (error) {alert(error.message);}
         });
             
      </script>
   </body>
</html>
