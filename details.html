<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>تفاصيل عن المدرب</title>
      <style>
         body{
         font-family: Arial, sans-serif;
         background:#D6D6D6;
         text-align:center;
         padding:30px;
         }
         .card{
         background:white;
         max-width:700px;
         margin:auto;
         padding:20px;
         border-radius:15px;
         box-shadow:0 5px 15px rgba(0,0,0,0.2);
         }
         img{
         width:300px;
         border-radius:15px;
         }
         ul{
         list-style:none;
         padding:0;
         }
         #places{
         display:flex;
         justify-content:center;
         gap:10px;
         flex-wrap:wrap;
         }
         li{
         background:#eee;
         margin:10px;
         padding:10px;
         border-radius:10px;
         }
         button{
         background:#C62828;
         color:white;
         border:none;
         padding:12px 20px;
         border-radius:8px;
         cursor:pointer;
         }
         button:hover{
         background:#A00000;
         }
      </style>
   </head>
   <body>
      <div class="card">
         <h1 id="name"></h1>
         <img id="img" alt="coach image">
         <h3 id="sport"></h3>
         <p><b>:المكان</b> <span id="area"></span></p>
         <p><b>:رقم التواصل</b> <span id="phone"></span></p>
         <p><b>:السعر</b> <span id="price"></span></p>
         <p id="about"></p>
         <h2>مكان التدريب</h2>
         <div id="places"></div>
         <h2>الشهادات الحاصل عليها المدرب</h2>
         <ul id="certs"></ul>
         <br>
         <button onclick="history.back()">
         العودة
         </button>
      </div>

          import { db } from "./firebase.js";
         
         import {
         doc,
         getDoc
         } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
         const params = new URLSearchParams(window.location.search);
         
         let coach;
         
         const id = params.get("id");
         
         if (id) {
          const coachRef = doc(db, "coaches", id);
          const coachSnap = await getDoc(coachRef);
         
          if (coachSnap.exists()) {
              coach = coachSnap.data();
              coach.img = coach.imageUrl || "";
              coach.price = coach.price + " EGP / Session";
              coach.sport = coach.specialization;
              coach.name = coach.fullName;
              coach.certs = coach.certs || [];
              coach.trainingPlaces = coach.trainingPlaces || [];
          }
         } else {
          const name = params.get("name");
          coach = data[name];
         }
         if (!coach) {
          document.body.innerHTML = "<h2>Coach not found</h2>";
          throw new Error("No coach found");
         }
         document.getElementById("name").textContent = coach.name || coach.fullName;
         document.getElementById("sport").textContent = coach.sport;
         document.getElementById("img").src = coach.img;
         document.getElementById("area").textContent = coach.area;
         document.getElementById("phone").textContent = coach.phone;
         document.getElementById("price").textContent = coach.price;
         document.getElementById("about").textContent = coach.about;
         const ul = document.getElementById("certs");
         
         coach.certs.forEach(cert => {
         const li = document.createElement("li");
         
         const img = document.createElement("img");
         img.src = cert;
         img.style.width = "150px";
         img.style.margin = "10px";
         img.style.borderRadius = "10px";
         
         li.appendChild(img);
         ul.appendChild(li);
         });
         
         const placesDiv = document.getElementById("places");
         
         coach.trainingPlaces.forEach(imgUrl => {
         const img = document.createElement("img");
         img.src = imgUrl;
         img.style.width = "150px";
         img.style.margin = "10px";
         img.style.borderRadius = "10px";
         
         placesDiv.appendChild(img);
         });

</html>
